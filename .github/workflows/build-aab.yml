name: Build CaptionPop AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download web app
        run: |
          mkdir -p www
          curl -sL https://vibecode404.github.io/CaptionPop/index.html -o www/index.html
          curl -sL https://vibecode404.github.io/CaptionPop/manifest.json -o www/manifest.json
          curl -sL https://vibecode404.github.io/CaptionPop/icon-192.png -o www/icon-192.png
          curl -sL https://vibecode404.github.io/CaptionPop/icon-512.png -o www/icon-512.png
          ls -lh www/

      - name: Bundle Whisper tiny model (offline, quantized)
        run: |
          mkdir -p www/models/Xenova/whisper-tiny/onnx
          BASE="https://huggingface.co/Xenova/whisper-tiny/resolve/main"
          curl -sL "$BASE/config.json" -o www/models/Xenova/whisper-tiny/config.json
          curl -sL "$BASE/generation_config.json" -o www/models/Xenova/whisper-tiny/generation_config.json
          curl -sL "$BASE/preprocessor_config.json" -o www/models/Xenova/whisper-tiny/preprocessor_config.json
          curl -sL "$BASE/tokenizer.json" -o www/models/Xenova/whisper-tiny/tokenizer.json
          curl -sL "$BASE/tokenizer_config.json" -o www/models/Xenova/whisper-tiny/tokenizer_config.json
          curl -sL "$BASE/onnx/encoder_model_quantized.onnx" -o www/models/Xenova/whisper-tiny/onnx/encoder_model_quantized.onnx
          curl -sL "$BASE/onnx/decoder_model_merged_quantized.onnx" -o www/models/Xenova/whisper-tiny/onnx/decoder_model_merged_quantized.onnx
          du -sh www/models/

      - name: Bundle Hinglish model for Hindi (offline, quantized)
        run: |
          mkdir -p www/models/mahajanGaurav/whisper-hinglish-tiny-onnx/onnx
          HB="https://huggingface.co/mahajanGaurav/whisper-hinglish-tiny-onnx/resolve/main"
          curl -sL "$HB/config.json" -o www/models/mahajanGaurav/whisper-hinglish-tiny-onnx/config.json
          curl -sL "$HB/generation_config.json" -o www/models/mahajanGaurav/whisper-hinglish-tiny-onnx/generation_config.json
          curl -sL "$HB/preprocessor_config.json" -o www/models/mahajanGaurav/whisper-hinglish-tiny-onnx/preprocessor_config.json
          curl -sL "$HB/tokenizer.json" -o www/models/mahajanGaurav/whisper-hinglish-tiny-onnx/tokenizer.json
          curl -sL "$HB/tokenizer_config.json" -o www/models/mahajanGaurav/whisper-hinglish-tiny-onnx/tokenizer_config.json
          curl -sL "$HB/onnx/encoder_model_quantized.onnx" -o www/models/mahajanGaurav/whisper-hinglish-tiny-onnx/onnx/encoder_model_quantized.onnx
          curl -sL "$HB/onnx/decoder_model_merged_quantized.onnx" -o www/models/mahajanGaurav/whisper-hinglish-tiny-onnx/onnx/decoder_model_merged_quantized.onnx
          du -sh www/models/

      - name: Assemble SaveFile plugin folder
        run: |
          # The plugin's files were uploaded to the repo ROOT (package.json,
          # index.js, android/) instead of a savefile-plugin/ folder. Gather
          # them into ./savefile-plugin for the npm install below — moving
          # (not copying) also clears the stray root android/ folder, which
          # would otherwise block `npx cap add android` later in this job.
          mkdir -p savefile-plugin
          mv package.json index.js savefile-plugin/
          mv android savefile-plugin/android
          ls -R savefile-plugin

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          # Local SaveFile plugin (saves exports straight to Downloads) — folder lives in the repo root
          npm install ./savefile-plugin
          npx cap init "CaptionPop" "com.vibecode404.captionpop" --web-dir=www
          npx cap add android
          npx cap sync android
          # Fix minSdkVersion to 24 (Play requires 24+)
          sed -i "s/minSdkVersion = 23/minSdkVersion = 24/" android/variables.gradle
          # Fix targetSdkVersion to 36 (Play requires 36+ in 2026)
          sed -i "s/targetSdkVersion = 35/targetSdkVersion = 36/" android/variables.gradle
          # Bump versionCode dynamically (run number avoids "already used" errors)
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -E "minSdkVersion|targetSdkVersion" android/variables.gradle
          grep "versionCode" android/app/build.gradle | head -2

      - name: Restore upload keystore from secret
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE }}" | base64 -d > upload.keystore
          echo "Keystore restored from secret"
          keytool -list -v -keystore upload.keystore -storepass captionpop123 2>&1 | grep "SHA1" | head -2

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('../../upload.keystore')
                      storePassword 'captionpop123'
                      keyAlias 'captionpop'
                      keyPassword 'captionpop123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
              packagingOptions {
                  exclude 'META-INF/*.kotlin_module'
                  exclude 'META-INF/AL2.0'
                  exclude 'META-INF/LGPL2.1'
              }
          }
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          echo "Signing configured"

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: captionpop-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload keystore (KEEP SAFE!)
        uses: actions/upload-artifact@v4
        with:
          name: captionpop-keystore
          path: upload.keystore
