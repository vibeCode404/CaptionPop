name: Build CaptionPop APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download web app
        run: |
          mkdir -p www
          curl -sL https://vibecode404.github.io/CaptionPop/index.html -o www/index.html
          curl -sL https://vibecode404.github.io/CaptionPop/manifest.json -o www/manifest.json
          curl -sL https://vibecode404.github.io/CaptionPop/icon-192.png -o www/icon-192.png
          curl -sL https://vibecode404.github.io/CaptionPop/icon-512.png -o www/icon-512.png
      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "CaptionPop" "com.vibecode404.captionpop" --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: captionpop-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
