name: Build CaptionPop AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download web app
        run: |
          mkdir -p www
          curl -sL https://vibecode404.github.io/CaptionPop/index.html -o www/index.html
          curl -sL https://vibecode404.github.io/CaptionPop/manifest.json -o www/manifest.json
          curl -sL https://vibecode404.github.io/CaptionPop/icon-192.png -o www/icon-192.png
          curl -sL https://vibecode404.github.io/CaptionPop/icon-512.png -o www/icon-512.png
          ls -lh www/

      - name: Bundle Whisper tiny model (offline)
        run: |
          mkdir -p www/models/Xenova/whisper-tiny/onnx
          BASE="https://huggingface.co/Xenova/whisper-tiny/resolve/main"
          curl -sL "$BASE/config.json" -o www/models/Xenova/whisper-tiny/config.json
          curl -sL "$BASE/tokenizer.json" -o www/models/Xenova/whisper-tiny/tokenizer.json
          curl -sL "$BASE/tokenizer_config.json" -o www/models/Xenova/whisper-tiny/tokenizer_config.json
          curl -sL "$BASE/onnx/encoder_model.onnx" -o www/models/Xenova/whisper-tiny/onnx/encoder_model.onnx
          curl -sL "$BASE/onnx/decoder_model.onnx" -o www/models/Xenova/whisper-tiny/onnx/decoder_model.onnx
          curl -sL "$BASE/onnx/decoder_with_past_model.onnx" -o www/models/Xenova/whisper-tiny/onnx/decoder_with_past_model.onnx
          du -sh www/models/

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "CaptionPop" "com.vibecode404.captionpop" --web-dir=www
          npx cap add android
          npx cap sync android
          # Fix minSdkVersion to 24 (Play requires 24+)
          sed -i "s/minSdkVersion = 23/minSdkVersion = 24/" android/variables.gradle
          grep "minSdkVersion" android/variables.gradle

      - name: Generate upload keystore
        run: |
          keytool -genkeypair -v -keystore upload.keystore \
            -alias captionpop -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass captionpop123 -keypass captionpop123 \
            -dname "CN=vibeCode404, OU=CaptionPop, O=vibeCode404, L=Unknown, ST=Unknown, C=US"
          echo "Keystore generated"

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('../../upload.keystore')
                      storePassword 'captionpop123'
                      keyAlias 'captionpop'
                      keyPassword 'captionpop123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
              packagingOptions {
                  exclude 'META-INF/*.kotlin_module'
                  exclude 'META-INF/AL2.0'
                  exclude 'META-INF/LGPL2.1'
              }
          }
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          echo "Signing configured"

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: captionpop-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload keystore (KEEP SAFE!)
        uses: actions/upload-artifact@v4
        with:
          name: captionpop-keystore
          path: upload.keystore
